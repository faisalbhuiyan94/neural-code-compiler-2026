<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" rx="18" fill="url(#bg1)"/>

  <!-- Code Matrix Grid -->
  <g stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="900" y1="0" x2="900" y2="500" />
  </g>

  <!-- Badge -->
  <rect x="410" y="40" width="380" height="34" rx="17" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="63" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">⚡ NEURAL COMPILER &amp; AST SYNTHESIS</text>

  <!-- Headline -->
  <text x="600" y="125" fill="url(#grad1)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="900" text-anchor="middle">AI CODE SYNTHESIS &amp; REFINEMENT</text>
  <text x="600" y="160" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" text-anchor="middle">Autonomous Abstract Syntax Tree (AST) Optimization &amp; Self-Repairing Code</text>

  <!-- 3 Feature Cards -->
  <g transform="translate(80, 220)">
    <rect width="320" height="210" rx="16" fill="url(#card1)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="40" y="50" fill="#38bdf8" font-size="22">⚡</text>
    <text x="75" y="48" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">Self-Refining AST</text>
    <text x="30" y="95" fill="#94a3b8" font-family="sans-serif" font-size="14">Multi-pass syntax verification</text>
    <text x="30" y="125" fill="#94a3b8" font-family="sans-serif" font-size="14">Automated runtime defect repair</text>
    <text x="30" y="155" fill="#94a3b8" font-family="sans-serif" font-size="14">Zero-hallucination type checking</text>
    <rect x="30" y="175" width="85" height="20" rx="6" fill="#0284c7" fill-opacity="0.4"/>
    <text x="72" y="189" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">98.9% PASS@1</text>
  </g>

  <g transform="translate(440, 220)">
    <rect width="320" height="210" rx="16" fill="url(#card1)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="40" y="50" fill="#818cf8" font-size="22">🧬</text>
    <text x="75" y="48" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">Multi-Model Ensemble</text>
    <text x="30" y="95" fill="#94a3b8" font-family="sans-serif" font-size="14">Cross-verifying LLM generations</text>
    <text x="30" y="125" fill="#94a3b8" font-family="sans-serif" font-size="14">Dynamic formal verification</text>
    <text x="30" y="155" fill="#94a3b8" font-family="sans-serif" font-size="14">Sub-second execution test loop</text>
    <rect x="30" y="175" width="100" height="20" rx="6" fill="#4338ca" fill-opacity="0.4"/>
    <text x="80" y="189" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">ZERO DRIFT</text>
  </g>

  <g transform="translate(800, 220)">
    <rect width="320" height="210" rx="16" fill="url(#card1)" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="40" y="50" fill="#22d3ee" font-size="22">🚀</text>
    <text x="75" y="48" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">Native Compilation</text>
    <text x="30" y="95" fill="#94a3b8" font-family="sans-serif" font-size="14">LLVM Intermediate Representation</text>
    <text x="30" y="125" fill="#94a3b8" font-family="sans-serif" font-size="14">Targeted binary optimization</text>
    <text x="30" y="155" fill="#94a3b8" font-family="sans-serif" font-size="14">WASM &amp; Native x86/ARM emit</text>
    <rect x="30" y="175" width="95" height="20" rx="6" fill="#0891b2" fill-opacity="0.4"/>
    <text x="77" y="189" fill="#a5f3fc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">SUB-10MS JIT</text>
  </g>
</svg>
